services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: app:shared
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./public_html:/var/www/html:ro
      - ./project/app:/var/www/project/app:ro
      - ./project/bootstrap:/var/www/project/bootstrap:ro
      - ./project/config:/var/www/project/config:ro
      - ./project/contract:/var/www/project/contract:ro
      - ./project/database:/var/www/project/database:ro
      - ./project/provider:/var/www/project/provider:ro
      - ./project/env.json:/var/www/project/env.json:ro
      - storage:/var/www/project/storage
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-shared.ini:ro
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro

volumes:
  storage:
