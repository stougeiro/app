expose_php = Off

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/project/storage/log/php-error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

memory_limit = 128M
max_execution_time = 30
post_max_size = 8M
upload_max_filesize = 8M
max_file_uploads = 20

date.timezone = UTC
session.save_path = /var/www/project/storage/session
upload_tmp_dir = /tmp
sys_temp_dir = /tmp

open_basedir = /var/www:/tmp

disable_functions = exec,passthru,shell_exec,system,proc_open,popen

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
