ServerName localhost
ServerTokens Prod
ServerSignature Off

LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" timed

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog "|/usr/bin/rotatelogs -l -c /var/www/application/storage/log/apache-error-%Y%m%d.log 86400"
    CustomLog "|/usr/bin/rotatelogs -l -c /var/www/application/storage/log/apache-access-%Y%m%d.log 86400" timed
</VirtualHost>
