ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog "|/usr/bin/rotatelogs -l -c /var/www/project/storage/log/apache-error-%Y%m%d.log 86400"
    CustomLog "|/usr/bin/rotatelogs -l -c /var/www/project/storage/log/apache-access-%Y%m%d.log 86400" combined
</VirtualHost>
